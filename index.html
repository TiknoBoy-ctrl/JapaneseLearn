html,body{

}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
        radial-gradient(circle at 20% 20%, #003b46, transparent 35%),
        radial-gradient(circle at 80% 80%, #001b44, transparent 35%),
        #020509;

    color:white;

    font-family:
        Arial,
        "Segoe UI",
        sans-serif;
}

body::before{
    content:"";
    position:fixed;

    width:600px;
    height:600px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.15),
            transparent 65%
        );

    animation:move 8s infinite alternate;

    pointer-events:none;
}

@keyframes move{

    from{
        transform:translate(-20%,-20%);
    }

    to{
        transform:translate(20%,20%);
    }

}

.content{

    position:relative;

    width:min(600px,90%);

    padding:50px 30px;

    text-align:center;

    border-radius:30px;

    background:
        rgba(10,15,25,.78);

    border:
        1px solid
        rgba(0,255,255,.2);

    box-shadow:
        0 0 30px rgba(0,255,255,.15),
        0 0 100px rgba(0,0,0,.8);

    backdrop-filter:blur(15px);
}

.number{

    color:#00ffff;

    font-size:16px;

    margin-bottom:15px;

    opacity:.7;
}

#word{

    font-size:70px;

    margin-bottom:10px;

    color:white;

    text-shadow:
        0 0 10px white,
        0 0 25px #00ffff,
        0 0 50px #0099ff;
}

#romaji{

    font-size:25px;

    color:#9befff;

    margin-bottom:35px;
}

.buttons{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    direction:ltr;
}

button{

    border:none;

    cursor:pointer;

    color:white;

    border-radius:15px;

    font-size:20px;

    padding:17px 35px;

    background:
        linear-gradient(
            45deg,
            #0066ff,
            #00cfff
        );

    transition:.25s;
}

button:hover{

    transform:scale(1.06);

    box-shadow:
        0 0 20px #00cfff,
        0 0 40px #0066ff;
}

.slow{

    width:60px;

    height:60px;

    padding:0;

    font-size:28px;

    background:
        linear-gradient(
            45deg,
            #168a45,
            #38d66b
        );
}

.slow:hover{

    box-shadow:
        0 0 20px #38d66b,
        0 0 40px #168a45;
}

#error{

    display:none;

    color:#ff5555;

    font-size:28px;
}

@media(max-width:600px){

    .content{
        padding:40px 20px;
    }

    #word{
        font-size:45px;
    }

    #romaji{
        font-size:20px;
    }

    button{
        font-size:17px;

    }

}

</style>
