<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Japanese Learn</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
        radial-gradient(circle at 20% 20%, #003b46, transparent 35%),
        radial-gradient(circle at 80% 80%, #001b44, transparent 35%),
        #020509;

    color:white;

    font-family:
        Arial,
        "Segoe UI",
        sans-serif;
}


/* خلفية متحركة */

body::before{

    content:"";

    position:fixed;

    width:600px;
    height:600px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.15),
            transparent 65%
        );

    animation:move 8s infinite alternate;

    pointer-events:none;
}


@keyframes move{

    from{
        transform:translate(-20%,-20%);
    }

    to{
        transform:translate(20%,20%);
    }

}


/* البطاقة */

.content{

    position:relative;

    width:min(600px,90%);

    padding:50px 30px;

    text-align:center;

    border-radius:30px;

    background:
        rgba(10,15,25,.78);

    border:
        1px solid
        rgba(0,255,255,.2);

    box-shadow:

        0 0 30px
        rgba(0,255,255,.15),

        0 0 100px
        rgba(0,0,0,.8);

    backdrop-filter:blur(15px);

}


/* رقم الكلمة */

.number{

    color:#00ffff;

    font-size:16px;

    margin-bottom:15px;

    opacity:.7;

}


/* الكلمة */

#word{

    font-size:70px;

    margin-bottom:10px;

    color:white;

    text-shadow:

        0 0 10px white,

        0 0 25px #00ffff,

        0 0 50px #0099ff;

}


/* النطق */

#romaji{

    font-size:25px;

    color:#9befff;

    margin-bottom:35px;

}


/* الأزرار */

.buttons{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    direction:ltr;

}


button{

    border:none;

    cursor:pointer;

    color:white;

    border-radius:15px;

    font-size:20px;

    padding:17px 35px;

    background:
        linear-gradient(
            45deg,
            #0066ff,
            #00cfff
        );

    transition:.25s;

}


button:hover{

    transform:scale(1.06);

    box-shadow:

        0 0 20px #00cfff,

        0 0 40px #0066ff;

}


.slow{

    width:60px;

    height:60px;

    padding:0;

    font-size:28px;

    background:
        linear-gradient(
            45deg,
            #168a45,
            #38d66b
        );

}


.slow:hover{

    box-shadow:

        0 0 20px #38d66b,

        0 0 40px #168a45;

}


/* خطأ */

#error{

    display:none;

    color:#ff5555;

    font-size:28px;

}


@media(max-width:600px){

    .content{

        padding:40px 20px;

    }

    #word{

        font-size:45px;

    }

    #romaji{

        font-size:20px;

    }

    button{

        font-size:17px;

        padding:15px 25px;

    }

}


</style>

</head>


<body>


<div class="content">


    <div id="normalContent">


        <div class="number" id="number">

            Word 01

        </div>


        <h1 id="word">

            ありがとう

        </h1>


        <div id="romaji">

            Arigatou

        </div>


        <div class="buttons">


            <button onclick="playNormal()">

                🔊 تشغيل الصوت

            </button>


            <button
                class="slow"
                onclick="playSlow()"
                title="تشغيل ببطء"
            >

                🐢

            </button>


        </div>


        <audio id="audio"></audio>


    </div>


    <div id="error">

        الكلمة غير موجودة

    </div>


</div>


<script>


/* =====================================================
   قائمة الكلمات
===================================================== */


const words = [

    ["ありがとう","Arigatou","01_arigatou.wav"],

    ["あぶない","Abunai","02_abunai.wav"],

    ["いたい","Itai","03_itai.wav"],

    ["いぬ","Inu","04_inu.wav"],

    ["うみ","Umi","05_umi.wav"],

    ["うそ","Uso","06_uso.wav"],

    ["えっと","Etto","07_etto.wav"],

    ["えき","Eki","08_eki.wav"],

    ["おめでとう","Omedetou","09_omedetou.wav"],

    ["おいしい","Oishii","10_oishii.wav"]

    /* سنضيف باقي الكلمات بعد التأكد أن النظام يعمل */

];


/* =====================================================
   قراءة الرقم من الرابط
===================================================== */


const params =
    new URLSearchParams(
        window.location.search
    );


let wordNumber =
    params.get("word");


/* إذا لم يوجد رقم */

if(!wordNumber){

    wordNumber = "01";

}


/* إزالة أي رموز غير رقمية */

wordNumber =
    wordNumber.replace(
        /[^0-9]/g,
        ""
    );


/* إضافة صفر إذا كان الرقم مفرد */

if(wordNumber.length === 1){

    wordNumber =
        "0" + wordNumber;

}


/* تحويل إلى رقم */

const index =
    parseInt(wordNumber,10) - 1;


/* =====================================================
   عرض الكلمة
===================================================== */


if(

    isNaN(index) ||

    index < 0 ||

    index >= words.length

){

    document
        .getElementById("normalContent")
        .style.display="none";

    document
        .getElementById("error")
        .style.display="block";

}

else{


    const data =
        words[index];


    document
        .getElementById("number")
        .textContent =
        "Word " +
        wordNumber;


    document
        .getElementById("word")
        .textContent =
        data[0];


    document
        .getElementById("romaji")
        .textContent =
        data[1];


    document
        .getElementById("audio")
        .src =
        "Japan/" +
        data[2];


}


/* =====================================================
   الصوت العادي
===================================================== */


function playNormal(){


    const audio =
        document.getElementById("audio");


    audio.pause();


    audio.currentTime=0;


    audio.playbackRate=1;


    audio.play();


}


/* =====================================================
   الصوت البطيء
===================================================== */


function playSlow(){


    const audio =
        document.getElementById("audio");


    audio.pause();


    audio.currentTime=0;


    audio.playbackRate=.65;


    audio.play();


}


</script>


</body>

</html>
